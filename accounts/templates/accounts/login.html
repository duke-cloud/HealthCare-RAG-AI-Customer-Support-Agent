{% extends 'base.html' %}
{% block auth_content %}
<div class="landing">
  <div class="landing-box">
    <div style="font-size:52px;margin-bottom:12px">🏥</div>
    <h1>HealthCare RAG</h1>
    <p>AI-powered customer support for healthcare — secure, private, and HIPAA-aware.</p>
    {% if form.errors %}
    <div class="alert alert-danger" style="text-align:left">Invalid username or password.</div>
    {% endif %}
    <form method="post" style="text-align:left">{% csrf_token %}
      <div class="form-group"><label class="form-label">Username</label>
        <input name="username" class="form-control" placeholder="Enter username" required autofocus></div>
      <div class="form-group"><label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="Enter password" required></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px">Sign In →</button>
    </form>
    <p style="margin-top:16px;font-size:13px;opacity:.7">New user? <a href="{% url 'register' %}" style="color:#7dd3fc;font-weight:700">Create account</a></p>
  </div>
</div>
{% endblock %}
