{% extends 'base.html' %}
{% block auth_content %}
<div class="landing">
  <div class="landing-box" style="max-width:480px">
    <div style="font-size:44px;margin-bottom:10px">🏥</div>
    <h1 style="font-size:24px">Create Account</h1>
    <p>Join HealthCare RAG — get instant AI-powered support answers.</p>
    {% if form.errors %}
    <div class="alert alert-danger" style="text-align:left">{{ form.errors.as_text }}</div>
    {% endif %}
    <form method="post" style="text-align:left">{% csrf_token %}
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">First Name</label>
          <input name="first_name" class="form-control" required placeholder="First name"></div>
        <div class="form-group"><label class="form-label">Last Name</label>
          <input name="last_name"  class="form-control" required placeholder="Last name"></div>
      </div>
      <div class="form-group"><label class="form-label">Username</label>
        <input name="username" class="form-control" required placeholder="Choose a username"></div>
      <div class="form-group"><label class="form-label">Email</label>
        <input name="email" type="email" class="form-control" required placeholder="Your email"></div>
      <div class="form-group"><label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" required></div>
      <div class="form-group"><label class="form-label">I am a</label>
        <select name="role" class="form-control">
          <option value="patient">Patient</option>
          <option value="staff">Healthcare Staff</option>
        </select></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px">Create Account</button>
    </form>
    <p style="margin-top:16px;font-size:13px;opacity:.7">Already registered? <a href="{% url 'login' %}" style="color:#7dd3fc;font-weight:700">Sign in</a></p>
  </div>
</div>
{% endblock %}
